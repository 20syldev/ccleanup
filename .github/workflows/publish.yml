name: ccleanup package publish

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    verify:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm test

    publish-npm:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/
                  cache: npm

            - run: npm --version

            - run: npm ci

            # Guard against publishing a tag that does not match package.json
            - run: |
                  case "$GITHUB_REF" in
                    refs/tags/*) ;;
                    *) echo "Refusing to publish from $GITHUB_REF; run this on a tag."; exit 1 ;;
                  esac
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  [ "$tag" = "$pkg" ] || { echo "Tag $tag != package.json $pkg"; exit 1; }

            # Skip a version already on npm, such as the first one published by hand
            - id: registry
              run: |
                  name="$(node -p "require('./package.json').name")"
                  version="$(node -p "require('./package.json').version")"
                  if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                    echo "$name@$version is already on npm: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

            - if: steps.registry.outputs.published != 'true'
              run: npm stage publish --provenance
